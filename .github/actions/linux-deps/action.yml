name: Linux build dependencies
description: >
  The libraries listed under "Building" in README.md, and the registry cache
  every Rust job shares.

inputs:
  extra:
    description: Further apt packages, space separated.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: apt
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
          pkg-config \
          libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev \
          libfontconfig-dev libfreetype-dev \
          ${{ inputs.extra }}

    # Downloaded crates only. `target` is not cached: a dist build is one
    # codegen unit with LTO, so nothing in it survives a source change, and it
    # is several gigabytes to upload after every job.
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-registry-${{ runner.os }}-${{ runner.arch }}-
