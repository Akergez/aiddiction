[package]
name = "aiddiction"
description = "Projects and ACP agents on your own servers, from the desktop or a phone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# A shared object as well, which is what an Android activity loads.
[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
# Links the icon into the Windows executable (`build.rs`); the version GPUI
# embeds its manifest with.
embed-resource = "3"

[dependencies]
aiddiction-api.workspace = true
aiddiction-client.workspace = true
aiddiction-paths.workspace = true
diffreview.workspace = true
diffreview-ui.workspace = true
async-channel = "2.5"
gpui-kit = "0.7.0"
# The Android side shared with money-manager-ng and matterfast: android_main,
# the keyboard, back, the status bar, the insets, links. Every function of it
# also exists off Android. Its Java half is `com.akergez.gpui:android-glue`
# in android/app/build.gradle.kts, at the same version. `platform-verifier`
# hands the activity to rustls-platform-verifier, which the client's event and
# ACP sockets check certificates with. To work on it beside the application,
# swap this for the path variant and build the package with -PglueLocal.
gpui-android-glue = { git = "https://github.com/Akergez/gpui-android-glue", tag = "v0.1.2", features = ["platform-verifier"] }
# gpui-android-glue = { path = "../../../gpui-android-glue", features = ["platform-verifier"] }
# The theme's colours: a Material You scheme made from the system's colour,
# and themes made for the Zed editor to wear instead (money-manager-ng's and
# matterfast's engine). Cargo.lock pins the commit.
gpui-adaptive-colors = { git = "https://github.com/Akergez/gpui-adaptive-colors", branch = "main" }
gpui-zed-themes = { git = "https://github.com/Akergez/gpui-adaptive-colors", branch = "main" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# With no subscriber, events go to `log`, and from there to logcat.
tracing = { workspace = true, features = ["log"] }
