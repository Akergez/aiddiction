[package]
name = "aiddiction"
description = "Projects and ACP agents on your own servers, from the desktop or a phone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# A shared object as well, which is what an Android activity loads.
[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
# Links the icon into the Windows executable (`build.rs`); the version GPUI
# embeds its manifest with.
embed-resource = "3"

[dependencies]
aiddiction-api.workspace = true
aiddiction-client.workspace = true
aiddiction-paths.workspace = true
async-channel = "2.5"
gpui-kit = "0.7.0"
# The theme's colours: a Material You scheme made from the system's colour,
# and themes made for the Zed editor to wear instead (money-manager-ng's and
# matterfast's engine). Cargo.lock pins the commit.
gpui-adaptive-colors = { git = "https://github.com/Akergez/gpui-adaptive-colors", branch = "main" }
gpui-zed-themes = { git = "https://github.com/Akergez/gpui-adaptive-colors", branch = "main" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc = "0.2"

# The platform GPUI does not ship, from the fork money-manager-ng and
# matterfast use at this very revision; it tracks the same `gpui-pre`.
[target.'cfg(target_os = "android")'.dependencies]
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "9075e3aa3eea812127f2c60ed66f0cd5798ff245" }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"
jni = "0.22.4"
# With no subscriber, events go to `log`, and from there to logcat.
tracing = { workspace = true, features = ["log"] }
