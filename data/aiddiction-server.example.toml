# aiddiction-server's configuration: ~/.config/aiddiction-server/config.toml
# (the platform's standard config directory elsewhere). Every key is
# optional; these are the defaults, commented out.

# Where to listen. To reach the server from a phone, an address the phone can
# reach — a VPN such as Tailscale, or the LAN — preferably behind a TLS proxy.
# listen = ["127.0.0.1:7878", "[::1]:7878"]
# AIDDICTION_LISTEN also accepts a comma-separated list of addresses.

# URL that locally spawned agents use to reach this server. Set this to the
# host address visible from an agent container, for example:
# mcp_url = "http://host.docker.internal:7878/api/v1/mcp"
# Per-agent URLs override `mcp_url`, which is useful when some agents run in
# Docker and others run on the host:
# [mcp_urls]
# codex = "http://host.docker.internal:7878/api/v1/mcp"
# claude = "http://127.0.0.1:7878/api/v1/mcp"

# Where new projects are made. Existing folders can be projects wherever
# they are.
# projects_root = "~/aiddiction-projects"

# The access token. Without one, the server makes one on first start and
# keeps it in its data directory (`aiddiction-server token` prints it).
# token = "…"

# Agents besides the built-in Claude Code and Codex. A command line run by
# bash in the project's folder, as Zed's `agent_servers` describe one; the
# same id replaces a built-in agent.
# [[agents]]
# id = "gemini"
# name = "Gemini CLI"
# command = "gemini"
# args = ["--experimental-acp"]
# env = { }
