[package]
name = "aidiction-client"
description = "Talks to an Aidiction server: REST, the event socket and ACP sockets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
aidiction-api.workspace = true
futures.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots", "handshake"] }
tracing.workspace = true

# Android keeps no file of root certificates; the system is asked instead.
[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7"
